# Continuous delivery. Every push to main and every version tag goes through:
#
#   CI (ci.yml) -> publish -> e2e -> release (tags) -> deploy-azure (gated)
#
# publish  builds multi-arch images (amd64 + arm64), pushes them to GHCR,
#          attaches an SBOM and build provenance, and signs them with cosign
#          (keyless: the signature is bound to this workflow's GitHub
#          identity, no signing key exists). Tags also publish the Helm chart
#          to GHCR as an OCI artifact.
# e2e      verifies the signatures, then installs exactly those images (and,
#          for tags, the published chart) into a fresh k3s cluster and drives
#          a real deployment through the API (scripts/e2e.sh).
# release  creates the GitHub Release, only after e2e passed.
# deploy-azure is OFF unless the repository variable AZURE_DEPLOY_ENABLED is
#          "true", and then waits for a reviewer to approve the "production"
#          environment. Nothing reaches production automatically.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false # never interrupt a publish half-way

env:
  REGISTRY: ghcr.io
  # Image and chart names. The owner is lowercase (OCI references must be).
  IMAGE: ghcr.io/vipul2902/clouddeploy
  WEB_IMAGE: ghcr.io/vipul2902/clouddeploy-web
  CHART_REPO: oci://ghcr.io/vipul2902/charts
  # Signatures must come from this workflow in this repository.
  SIGNER: ^https://github\.com/vipul2902/Go-Project/\.github/workflows/cd\.yml@
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_VERSION: v3.1.3
  HELM_VERSION: v4.3.0

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write     # push to GHCR
      id-token: write     # cosign keyless signing (OIDC)
      attestations: write # build provenance attestation
    strategy:
      matrix:
        include:
          - {name: clouddeploy, context: ., image: ghcr.io/vipul2902/clouddeploy}
          - {name: clouddeploy-web, context: web, image: ghcr.io/vipul2902/clouddeploy-web}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: sha-<full sha> always (immutable; what e2e deploys), "main" on
      # main, and 1.2.3 / 1.2 on version tags. Never "latest".
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}-release
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # Sign the digest, not a tag: tags can be moved, digests cannot.
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${{ matrix.image }}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Publish Helm chart
    if: github.ref_type == 'tag'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # Chart version and appVersion both follow the git tag (v1.2.3 -> 1.2.3),
      # so the chart's default image tag is the release's image.
      - id: pkg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/clouddeploy --version "$version" --app-version "$version" -d dist
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/clouddeploy-$version.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest=$(grep -oE 'sha256:[0-9a-f]{64}' push.log | head -1)
          echo "$GH_TOKEN" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "${CHART_REPO#oci://}/clouddeploy@${digest}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end (k3s)
    needs: [publish, chart]
    # chart is skipped on main; run when publish succeeded and chart either
    # succeeded or was skipped.
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.chart.result == 'success' || needs.chart.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      KUBE_CONTEXT: default
      K3S_VERSION: v1.37.1+k3s1
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only deploy what this workflow signed.
      - name: Verify signatures
        run: |
          for img in "$IMAGE:$IMAGE_TAG" "$WEB_IMAGE:$IMAGE_TAG"; do
            cosign verify "$img" --certificate-identity-regexp "$SIGNER" \
              --certificate-oidc-issuer "$OIDC_ISSUER" -o text >/dev/null
            echo "verified $img"
          done
      - name: Pull images
        run: docker pull -q "$IMAGE:$IMAGE_TAG" && docker pull -q "$WEB_IMAGE:$IMAGE_TAG"
      - name: Start k3s
        run: scripts/k3s-up.sh
      - name: Use the published chart (tags)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.chart.outputs.version }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign verify "${CHART_REPO#oci://}/clouddeploy:$VERSION" --certificate-identity-regexp "$SIGNER" \
            --certificate-oidc-issuer "$OIDC_ISSUER" -o text >/dev/null
          { echo "CHART=$CHART_REPO/clouddeploy"; echo "CHART_VERSION=$VERSION"; } >> "$GITHUB_ENV"
      - name: End-to-end test
        env:
          IMAGE_REPO: ${{ env.IMAGE }}
          WEB_IMAGE_REPO: ${{ env.WEB_IMAGE }}
          E2E_KEEP: "1" # the runner is discarded anyway
        run: scripts/e2e.sh

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [e2e, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.chart.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Artifacts

          | | |
          |---|---|
          | API / worker / migrate image | \`$IMAGE:$VERSION\` |
          | Dashboard image | \`$WEB_IMAGE:$VERSION\` |
          | Helm chart | \`helm install clouddeploy $CHART_REPO/clouddeploy --version $VERSION\` |

          Images are multi-arch (linux/amd64, linux/arm64) with SBOM and provenance attestations.
          Images and chart are signed with cosign (keyless). Verify with:

          \`\`\`
          cosign verify $IMAGE:$VERSION \\
            --certificate-identity-regexp '$SIGNER' \\
            --certificate-oidc-issuer $OIDC_ISSUER
          \`\`\`

          This release passed CI and an end-to-end deployment on k3s.
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes

  deploy-azure:
    name: Deploy to AKS (gated)
    # Off by default. When enabled, a reviewer must approve the "production"
    # environment (Settings > Environments) before this job starts.
    if: github.ref_type == 'tag' && vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: [release, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC federation to Azure: no client secret
    env:
      ENV: prod
      VERSION: ${{ needs.chart.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # IDs only (not secrets): the trust is the federated credential on the
      # Azure side, scoped to this repository's production environment.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Read infrastructure outputs
        env:
          ARM_USE_OIDC: "true"
        run: |
          printf 'resource_group_name = "%s"\nstorage_account_name = "%s"\ncontainer_name = "tfstate"\nkey = "prod.tfstate"\nuse_azuread_auth = true\nuse_oidc = true\n' \
            "${{ vars.TFSTATE_RESOURCE_GROUP }}" "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" > infra/terraform/envs/prod/backend.hcl
          terraform -chdir=infra/terraform/envs/prod init -input=false -backend-config=backend.hcl
      # The cluster pulls from ACR (kubelet identity), so copy the release
      # images there; the digests (and so the signatures) are unchanged.
      - name: Import images into ACR
        run: |
          reg=$(terraform -chdir=infra/terraform/envs/prod output -json platform | jq -r .acr_id | awk -F/ '{print $NF}')
          az acr import -n "$reg" --source "$IMAGE:$VERSION" -t "clouddeploy:$VERSION" --force
          az acr import -n "$reg" --source "$WEB_IMAGE:$VERSION" -t "clouddeploy-web:$VERSION" --force
      - name: Deploy
        run: |
          az aks install-cli --only-show-errors >/dev/null
          make azure-credentials ENV=prod KUBELOGIN=kubelogin
          make azure-deploy ENV=prod AZ_TAG="$VERSION"
