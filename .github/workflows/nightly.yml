# Slow checks that don't belong on every push: fuzzing every target and
# running the integration suite three times under the race detector to
# surface flaky tests. Runs nightly and on demand.
name: Nightly

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Fuzzing time per target
        default: 60s

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz all targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '60s' }}
        # make fuzz prints one line per target; fail if any target failed.
        run: make fuzz | tee fuzz.log && ! grep -q FAIL fuzz.log
      # A failing input is saved under testdata/fuzz; keep it for reproduction.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: "**/testdata/fuzz/**"

  stress:
    name: Integration x3 (race)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clouddeploy
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: clouddeploy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clouddeploy -d clouddeploy_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://clouddeploy:ci-only@localhost:5432/clouddeploy_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=3 -p 1 -tags integration ./...
