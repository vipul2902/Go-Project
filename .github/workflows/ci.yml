# Continuous integration: the same checks as `make test-all` and
# `make test-k8s`, plus image builds and security scans. Runs on every pull
# request, and is called by cd.yml for every push to main and every tag, so
# nothing is published without passing it. Nothing here deploys anything or
# needs cloud credentials.
#
# Third-party actions are pinned to full commit SHAs (tags can be moved);
# Dependabot keeps the pins current.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  # Distinct group when called from CD, so it never waits on itself.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  TERRAFORM_VERSION: 1.16.5
  HELM_VERSION: v4.3.0
  NODE_VERSION: "24"

jobs:
  lint:
    name: Go lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  unit:
    name: Go unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=unit.out ./...
      - run: go tool cover -func=unit.out | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: unit.out
          retention-days: 14

  integration:
    name: Go integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same images as docker-compose.yml. The credentials are throwaway values
    # for a database that exists only for the length of this job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clouddeploy
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: clouddeploy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clouddeploy -d clouddeploy_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://clouddeploy:ci-only@localhost:5432/clouddeploy_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # -p 1: packages share one test database. The Docker builder tests use
      # the runner's git and Docker.
      - run: go test -race -count=1 -p 1 -tags integration -coverpkg=./internal/... -coverprofile=integration.out ./...
      - run: go tool cover -func=integration.out | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: integration.out
          retention-days: 14

  kubernetes:
    name: Kubernetes tests (k3s)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clouddeploy
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: clouddeploy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clouddeploy -d clouddeploy_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://clouddeploy:ci-only@localhost:5432/clouddeploy_test?sslmode=disable
      KUBE_CONTEXT: default
      K3S_VERSION: v1.37.1+k3s1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # k3s in --docker mode shares the runner's Docker image store, exactly
      # like Colima locally: images the tests build are runnable without a
      # registry.
      - name: Start k3s
        run: |
          scripts/k3s-up.sh
          # The tests' base image is preloaded by k3s locally; pull it here.
          docker pull rancher/mirrored-library-busybox:1.37.0
      - run: go test -count=1 -p 1 -tags k8s -timeout 10m ./internal/kube/ ./internal/monitoring/
      - name: Cluster state on failure
        if: failure()
        run: kubectl get pods -A -o wide && kubectl get events -A --sort-by=.lastTimestamp | tail -50

  web:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - run: make helm-lint

  terraform:
    name: Terraform (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      # fmt, validate and `terraform test` with a mocked azurerm provider: no
      # Azure account or credentials involved.
      - run: make terraform-check

  images:
    name: Images (build + scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: clouddeploy, context: .}
          - {name: clouddeploy-web, context: web}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Built, never pushed: publishing images is CD's job (Phase 20).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: VERSION=${{ github.sha }}
          tags: ${{ matrix.name }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck (reachable vulnerabilities in Go code and dependencies)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: gitleaks (secrets in git history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (production dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
