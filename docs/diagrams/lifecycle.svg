<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker></defs><title>Deployment lifecycle</title><rect width="980" height="330" fill="#ffffff"/><text x="30" y="30" text-anchor="start" font-size="12.5" font-weight="400" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Every transition is a compare-and-swap UPDATE; workers hold a lease renewed by heartbeats.</text><rect x="30" y="60" width="200" height="60" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="130.0" y="86.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">QUEUED</text><text x="130.0" y="104.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">API, idempotency key</text><rect x="270" y="60" width="200" height="60" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="370.0" y="86.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">BUILDING</text><text x="370.0" y="104.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">worker claimed (lease)</text><rect x="510" y="60" width="200" height="60" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="610.0" y="86.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">DEPLOYING</text><text x="610.0" y="104.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">image ready</text><rect x="750" y="60" width="200" height="60" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="850.0" y="86.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">RUNNING</text><text x="850.0" y="104.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">rollout healthy</text><path d="M 230 90 L 270 90" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 470 90 L 510 90" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 710 90 L 750 90" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="270" y="220" width="200" height="60" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="370.0" y="246.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">FAILED</text><text x="370.0" y="264.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">error recorded, logs kept</text><rect x="510" y="220" width="200" height="60" rx="6" fill="none" stroke="#1f2937" stroke-width="1.5"/><text x="610.0" y="246.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">CANCELLED</text><text x="610.0" y="264.0" text-anchor="middle" font-size="12" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">user cancel, run stopped</text><path d="M 150 120 L 310 220" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 370 120 L 370 220" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 560 120 L 430 220" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 190 120 L 540 220" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M 420 120 L 580 220" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M 640 120 L 640 220" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)" stroke-dasharray="5 4"/><path d="M 270 262 L 110 262 L 110 120" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#arrow)"/><text x="118" y="200" text-anchor="start" font-size="11.5" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">auto-rollback:</text><text x="118" y="215" text-anchor="start" font-size="11.5" font-weight="400" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">new deployment</text><text x="30" y="320" text-anchor="start" font-size="12" font-weight="400" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Solid: failure path (build error, failed rollout, lost lease).   Dashed: cancellation.</text></svg>
