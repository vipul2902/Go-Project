# Local development stack. Services are grouped into profiles so only what is
# needed runs on a memory-constrained machine:
#   docker compose --profile deps up -d           # Postgres + Redis; run the API natively (make dev)
#   docker compose --profile core up -d           # Postgres + migrations + API in containers
#   docker compose --profile observability up -d  # Prometheus/Grafana (Phase 16)
#
# Secrets come from .env (gitignored). Compose refuses to start if they are unset.
name: clouddeploy

services:
  postgres:
    profiles: ["deps", "core"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clouddeploy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clouddeploy
    # Tuned for a laptop: few connections, small buffers.
    command: ["postgres", "-c", "max_connections=50", "-c", "shared_buffers=64MB", "-c", "log_min_duration_statement=250"]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432" # loopback only; 15432 avoids native Postgres installs on 5432/5433
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddeploy -d clouddeploy"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    profiles: ["deps", "core"]
    image: redis:7.4-alpine
    # volatile-lru evicts only keys that have a TTL (rate-limit state) when
    # memory is full. Keys without a TTL (the Phase 8 job queue) are never
    # evicted, so pressure cannot silently drop queued deployments.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379" # 16379 avoids a native Redis on 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 96m

  migrate:
    profiles: ["core"]
    build:
      context: .
      args:
        VERSION: compose
    entrypoint: ["/migrate", "up"]
    environment:
      DATABASE_URL: postgres://clouddeploy:${POSTGRES_PASSWORD}@postgres:5432/clouddeploy?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["core"]
    build:
      context: .
      args:
        VERSION: compose
    environment:
      APP_ENV: development
      PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://clouddeploy:${POSTGRES_PASSWORD}@postgres:5432/clouddeploy?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m

  worker:
    profiles: ["core"]
    build:
      context: .
      args:
        VERSION: compose
    entrypoint: ["/worker"]
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://clouddeploy:${POSTGRES_PASSWORD}@postgres:5432/clouddeploy?sslmode=disable
      # The container has no git/docker CLI and no Docker socket (mounting the
      # socket would give it root on the host), so it simulates builds. Run
      # `make worker` natively for real Docker builds (ADR-008).
      WORKER_BUILDER: dryrun
      WORKER_DEPLOYER: dryrun # Kubernetes deployer arrives in Phase 10
      WORKER_CONCURRENCY: "2"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s # > SHUTDOWN_TIMEOUT so in-flight jobs can drain
    deploy:
      resources:
        limits:
          memory: 64m

  # ---- observability profile (opt-in: ~300 MB) -------------------------
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d", "--web.enable-lifecycle"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    # host.lima.internal: the Mac, where make dev / make worker run.
    extra_hosts: ["host.lima.internal:192.168.5.2"]
    ports: ["127.0.0.1:9091:9090"]
    deploy: {resources: {limits: {memory: 160m}}}

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, jaeger]
    deploy: {resources: {limits: {memory: 160m}}}

  jaeger:
    profiles: ["observability"]
    # All-in-one Jaeger v2 with in-memory storage; receives OTLP on 4318.
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318"   # OTLP/HTTP
    deploy: {resources: {limits: {memory: 160m}}}

volumes:
  pgdata:
