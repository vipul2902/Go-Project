# Local cluster (Colima k3s). Images are built locally (make k8s-images), so
# nothing is pulled from a registry.
image:
  repository: clouddeploy
  tag: dev
config:
  appEnv: development
  logLevel: debug
  # The web pods (nginx) proxy /api: trust X-Forwarded-For from the k3s pod
  # network so rate limits and audit see the real client IP.
  trustedProxyCIDRs: "10.42.0.0/16"
api:
  replicas: 1
  pdb:
    enabled: false       # single replica: a PDB would block node drains
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
worker:
  builder: docker
  shutdownTimeout: 20s
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 500m, memory: 192Mi}
web:
  replicas: 1
  image:
    repository: clouddeploy-web
seed:
  enabled: true
dev:
  dockerSocket:
    enabled: true
  builderImage:
    tag: dev
