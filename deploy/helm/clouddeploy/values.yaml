# Defaults are production-safe: any environment-specific value lives in
# values-<env>.yaml, never in templates.

image:
  repository: clouddeploy
  tag: ""                # defaults to .Chart.AppVersion; use immutable tags (git SHA)
  pullPolicy: IfNotPresent

# Name of a pre-existing Secret with keys DATABASE_URL, REDIS_URL, JWT_SECRET
# (and SEED_PASSWORD when seed.enabled). The chart never contains secrets:
# create it from your secret store (e.g. Azure Key Vault via the CSI driver).
existingSecret: clouddeploy-secrets

config:
  appEnv: production     # development | staging | production
  logLevel: info
  # CIDRs of proxies allowed to set X-Forwarded-For (the ingress controller).
  trustedProxyCIDRs: ""

api:
  replicas: 2
  port: 8080
  shutdownTimeout: 20s
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  service:
    type: ClusterIP
    port: 80
  pdb:
    enabled: true
    minAvailable: 1      # voluntary disruptions (node drains) keep >= 1 pod
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

worker:
  replicas: 1
  concurrency: 2
  port: 8081
  leaseTTL: 30s
  shutdownTimeout: 30s
  # docker requires dev.dockerSocket (development only). acr runs builds on
  # ACR Tasks' isolated agents (ADR-008) and requires azure.enabled.
  builder: dryrun        # docker | acr | dryrun
  deployer: kubernetes   # kubernetes | dryrun
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

web:
  enabled: true
  replicas: 2
  image:
    repository: clouddeploy-web
    tag: ""              # defaults to image.tag
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 200m, memory: 64Mi}

# Azure (AKS): secrets come from Key Vault through the Secrets Store CSI
# driver, authenticated per component with workload identity. Each
# component gets its own synced Secret with only the keys it needs, and
# existingSecret is not used. Values come from `terraform output`.
azure:
  enabled: false
  tenantId: ""
  keyVaultName: ""
  # azure.workload.identity/client-id per service account.
  clientIds:
    api: ""
    worker: ""
    migrate: ""
  # Registry for WORKER_BUILDER=acr (ACR Tasks builds).
  acrRegistryId: ""

migrations:
  enabled: true          # Helm hook Job before install/upgrade

seed:
  enabled: false         # development data; the seed binary refuses non-dev

observability:
  # Prometheus metrics on internal ports only (API :9090, worker :8081/metrics),
  # never through the public Service or ingress. Pods carry prometheus.io/*
  # scrape annotations.
  metrics:
    enabled: true
    apiPort: 9090
  # OTLP/HTTP endpoint for traces (e.g. http://otel-collector.monitoring:4318).
  # Empty: tracing off (zero cost).
  otlpEndpoint: ""
  # Namespace allowed to scrape metrics when networkPolicy.enabled.
  scraperNamespaceLabels:
    kubernetes.io/metadata.name: monitoring

ingress:
  enabled: false
  className: ""
  host: clouddeploy.example.com
  tls:
    enabled: true
    secretName: clouddeploy-tls

networkPolicy:
  enabled: false
  # Namespace labels allowed to reach the API (e.g. the ingress controller's).
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx

# DEVELOPMENT ONLY. Mounting the node's Docker socket gives the worker root
# on the node. The chart refuses to render this with config.appEnv=production.
dev:
  dockerSocket:
    enabled: false
    path: /var/run/docker.sock
  builderImage:
    repository: clouddeploy-worker-builder
    tag: ""
