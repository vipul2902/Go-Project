{{- $fullname := include "clouddeploy.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "clouddeploy.labels" . | nindent 4 }}
---
# Read-only access for monitoring (environment health, application logs).
# No Secrets, no writes, no exec. Tenant isolation is enforced by the API:
# the namespace always comes from an environment the caller is authorized
# for, never from request input.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-api-monitoring
  labels: {{- include "clouddeploy.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-api-monitoring
  labels: {{- include "clouddeploy.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $fullname }}-api-monitoring}
subjects:
  - {kind: ServiceAccount, name: {{ $fullname }}-api, namespace: {{ .Release.Namespace }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "clouddeploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "clouddeploy.selector" (dict "root" . "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        {{- include "clouddeploy.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Roll pods when non-secret config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.observability.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.observability.metrics.apiPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      serviceAccountName: {{ $fullname }}-api
      # Token needed for the read-only monitoring role above.
      automountServiceAccountToken: true
      enableServiceLinks: false
      # preStop (5s) + SHUTDOWN_TIMEOUT (20s) must fit inside this.
      terminationGracePeriodSeconds: 30
      securityContext: {{- include "clouddeploy.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "clouddeploy.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ $fullname }}}
            - secretRef: {name: {{ .Values.existingSecret }}}
          env:
            - {name: SHUTDOWN_TIMEOUT, value: {{ .Values.api.shutdownTimeout | quote }}}
          ports:
            - {name: http, containerPort: {{ .Values.api.port }}, protocol: TCP}
            {{- if .Values.observability.metrics.enabled }}
            # Internal only: not part of the Service below.
            - {name: metrics, containerPort: {{ .Values.observability.metrics.apiPort }}, protocol: TCP}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            # Endpoint removal propagates asynchronously: keep serving for a
            # few seconds after SIGTERM is scheduled so no request hits a
            # pod that already stopped listening.
            preStop:
              sleep: {seconds: 5}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "clouddeploy.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "clouddeploy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector: {{- include "clouddeploy.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http, protocol: TCP}
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "clouddeploy.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "clouddeploy.selector" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "clouddeploy.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $fullname }}-api}
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }}}
{{- end }}
