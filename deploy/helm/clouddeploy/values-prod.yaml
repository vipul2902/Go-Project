# Production: highly available API, autoscaling, ingress with TLS, and
# NetworkPolicy. image.tag must be set to an immutable release tag by CD.
config:
  appEnv: production
  trustedProxyCIDRs: "10.0.0.0/8"
api:
  replicas: 3
  pdb:
    enabled: true
    minAvailable: 2
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
worker:
  replicas: 2
  concurrency: 4
ingress:
  enabled: true
  className: nginx
  host: clouddeploy.example.com
networkPolicy:
  enabled: true
